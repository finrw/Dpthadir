<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Kehadiran Pemilihan RW</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8102e">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background:#f4f6f9; margin:0; padding:15px; }
.container { max-width:500px; margin:0 auto; }
h2 { text-align:center; color:#1e293b; margin:0 0 15px; }
.dashboard { display:flex; gap:10px; margin-bottom:15px; }
.card { flex:1; background:#fff; padding:12px; border-radius:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,.05); }
.card h3 { margin:0; font-size:20px; color:#2563eb; }
.card p { margin:4px 0 0; font-size:11px; color:#64748b; font-weight:bold; }
.card.hadir h3 { color:#16a34a; }
.card.belum h3 { color:#dc2626; }
.scanner-box { background:#fff; padding:12px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
#reader { width:100%; border-radius:8px; overflow:hidden; background:#000; min-height:260px; }
#camMsg { text-align:center; font-size:13px; color:#64748b; margin-top:8px; }
#resultBox { display:none; margin-top:15px; padding:15px; border-radius:10px; text-align:center; font-weight:bold; }
.status-success { background:#dcfce7; color:#15803d; border:2px solid #86efac; }
.status-already { background:#fef9c3; color:#a16207; border:2px solid #fde047; }
.status-error { background:#fee2e2; color:#b91c1c; border:2px solid #fca5a5; }
.warga-info { text-align:left; margin-top:10px; font-weight:normal; font-size:14px; line-height:1.5; }
.list-box { background:#fff; margin-top:15px; padding:12px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.list-box h4 { margin:0 0 8px; color:#1e293b; font-size:15px; }
.tabs { display:flex; gap:6px; margin-bottom:8px; }
.tab { flex:1; padding:9px; border:none; border-radius:6px; background:#e2e8f0; color:#334155; font-weight:bold; font-size:13px; }
.tab.active { background:#2563eb; color:#fff; }
#listSearch { width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:8px; }
.list-item { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid #e2e8f0; font-size:13px; }
.list-item .nm { font-weight:bold; color:#0f172a; }
.list-item .sub { color:#64748b; font-size:12px; }
.list-item .tm { color:#16a34a; font-size:12px; white-space:nowrap; }
#listEmpty { color:#94a3b8; font-size:13px; text-align:center; padding:10px 0; }
#retryBtn { display:none; margin:10px auto 0; padding:10px 16px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; }
</style>
</head>
<body>
<div class="container">
  <h2>ABSENSI KEHADIRAN RW</h2>

  <div class="dashboard">
    <div class="card"><h3 id="statTotal">-</h3><p>TOTAL DPT</p></div>
    <div class="card hadir"><h3 id="statHadir">-</h3><p>HADIR</p></div>
    <div class="card belum"><h3 id="statBelum">-</h3><p>BELUM HADIR</p></div>
  </div>

  <div class="scanner-box">
    <div id="reader"></div>
    <div id="camMsg">Membuka kamera...</div>
    <button id="retryBtn" onclick="startCamera()">Buka Kamera Lagi</button>
  </div>

  <div class="list-box">
    <div class="tabs">
      <button class="tab active" id="tabHadir" onclick="setTab('hadir')">Hadir (<span id="cntHadir">0</span>)</button>
      <button class="tab" id="tabBelum" onclick="setTab('belum')">Belum Hadir (<span id="cntBelum">0</span>)</button>
    </div>
    <input type="text" id="listSearch" placeholder="Cari nama / blok..." oninput="renderList()">
    <div id="listItems"></div>
    <div id="listEmpty">Tidak ada data</div>
  </div>

  <div id="resultBox">
    <div id="statusTitle" style="font-size:18px;"></div>
    <div id="wargaDetails" class="warga-info"></div>
  </div>
</div>

<script>
// ====== ISI DUA NILAI INI ======
const API_URL = 'https://script.google.com/macros/s/AKfycbyQPHuCzSl4h4zDhRhOzXXZUn4e9CFjFzHXXD3kIX3UwqP86XtgJULHf2tjP1Cy7Zxs/exec';
const API_KEY = 'HDFlhgkyfcsj_jgkFDJ88-gdwsp,kihjbe$=2880'; // harus sama dengan di Code.gs
// ===============================

let scanner = null;
let isProcessing = false;
let audioCtx = null;

function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

async function api(params) {
  const qs = new URLSearchParams(Object.assign({ key: API_KEY }, params)).toString();
  const r = await fetch(API_URL + '?' + qs);
  return r.json();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function updateDashboard() {
  try {
    const res = await api({ action: 'stat' });
    if (res && res.success) {
      document.getElementById('statTotal').innerText = res.totalDpt;
      document.getElementById('statHadir').innerText = res.totalHadir;
      document.getElementById('statBelum').innerText = res.belumHadir;
    }
  } catch (e) {}
  loadList();
}

let daftar = { hadir: [], belum: [] };
let activeTab = 'hadir';

async function loadList() {
  try {
    const res = await api({ action: 'list' });
    if (res && res.success) {
      daftar = { hadir: res.hadir || [], belum: res.belum || [] };
      renderList();
    }
  } catch (e) {}
}

function setTab(t) {
  activeTab = t;
  document.getElementById('tabHadir').className = 'tab' + (t === 'hadir' ? ' active' : '');
  document.getElementById('tabBelum').className = 'tab' + (t === 'belum' ? ' active' : '');
  renderList();
}

function renderList() {
  const q = document.getElementById('listSearch').value.trim().toLowerCase();
  const rows = daftar[activeTab].filter(x =>
    !q || String(x.nama).toLowerCase().includes(q) || String(x.blok).toLowerCase().includes(q));
  document.getElementById('cntHadir').innerText = daftar.hadir.length;
  document.getElementById('cntBelum').innerText = daftar.belum.length;
  document.getElementById('listEmpty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('listItems').innerHTML = rows.map(x =>
    '<div class="list-item"><div><div class="nm">' + esc(x.nama) + '</div>' +
    '<div class="sub">DPT ' + esc(x.noDpt) + ' &bull; ' + esc(x.blok) + '</div></div>' +
    (x.waktu ? '<div class="tm">' + esc((String(x.waktu).match(/\d{2}:\d{2}(:\d{2})?/) || [x.waktu])[0]) + '</div>' : '') +
    '</div>').join('');
}

async function prosesToken(token) {
  const resBox = document.getElementById('resultBox');
  const title = document.getElementById('statusTitle');
  const details = document.getElementById('wargaDetails');
  resBox.style.display = 'block';
  resBox.className = '';
  title.innerText = 'Memeriksa Token...';
  details.innerHTML = '';

  try {
    const res = await api({ action: 'scan', token: token });
    const info =
      '<strong>Nama:</strong> ' + esc(res.nama) + '<br>' +
      '<strong>No. DPT:</strong> ' + esc(res.noDpt) + '<br>' +
      '<strong>Blok / Rumah:</strong> ' + esc(res.blok) + '<br>';
    if (res.success) {
      beep(800, 0.15);
      resBox.className = 'status-success';
      title.innerText = '✅ ' + res.message;
      details.innerHTML = info + '<strong>Waktu Hadir:</strong> ' + esc(res.waktu);
      updateDashboard();
    } else if (res.already) {
      beep(400, 0.35);
      resBox.className = 'status-already';
      title.innerText = '⚠️ ' + res.message;
      details.innerHTML = info + '<strong>Waktu Absen:</strong> ' + esc(res.waktu);
    } else {
      beep(250, 0.4);
      resBox.className = 'status-error';
      title.innerText = '❌ ' + res.message;
    }
  } catch (err) {
    resBox.className = 'status-error';
    title.innerText = '❌ Gagal terhubung ke server: ' + err.message;
  }
  setTimeout(() => { isProcessing = false; }, 2500);
}

function onScanSuccess(text) {
  if (isProcessing) return;
  isProcessing = true;
  prosesToken(text);
}

async function startCamera() {
  const msg = document.getElementById('camMsg');
  const retry = document.getElementById('retryBtn');
  retry.style.display = 'none';
  msg.innerText = 'Membuka kamera...';
  try {
    if (!scanner) scanner = new Html5Qrcode('reader');
    if (scanner.isScanning) await scanner.stop();
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      onScanSuccess,
      () => {}
    );
    msg.innerText = 'Arahkan kamera ke QR Code peserta';
  } catch (err) {
    msg.innerText = 'Kamera tidak bisa dibuka. Izinkan akses kamera di browser, lalu coba lagi.';
    retry.style.display = 'block';
  }
}

window.onload = function () {
  updateDashboard();
  setInterval(updateDashboard, 15000);
  startCamera();
};
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
</script>
</body>
</html>
